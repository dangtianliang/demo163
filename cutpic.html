<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Document</title>
	<style>
		/*wrap*/
		.mycut-bg{background-color: rgba(0, 0, 0, 0.5); position: fixed; left: 0px; right: 0px; top: 0px; bottom: 0px; z-index: 999999; display:none}
		.mycut-main{position:fixed;left:50%;width:1000px;height:600px;margin-left:-500px;margin-top:40px;border-radius:8px;background-color:#fff;overflow: hidden}
		.mycut-left{width:700px;position:relative;height:600px}
		.upload-box{position: absolute; left: 50%;top:50%;transform: translate(-50%,-50%);}
		.upload-box .initpic{display:block;border-radius:8px;max-width: 660px; max-height: 560px;}
		.mycut-right{width:300px;position:absolute;top:0;bottom:0;right:0;background-color:#efefef;text-align:center;padding:40px 10px;box-sizing: border-box}
		.mycut-right .imgshow{width:auto;border-radius:8px}
		.mycut-right .mycut-confirm{background-color:#00a0e9;border:0;color:#fff;line-height:36px;padding:0 20px;border-radius:4px;margin-top:30px;cursor: pointer;display: inline-block;text-decoration: none}
		.mycut-right .mycut-confirm:hover{background-color:#36c0ff;}
		.mycut-close{position:absolute;top:0;right:0;font-size:30px;text-align:center;width:30px;height:30px;line-height:30px;color:#ff595b;cursor:pointer}
		/*虚线框*/
		.dashed-box{width: 218px; height: 163.5px; border: 1px dashed rgb(239, 239, 239); position: absolute; top: 50.75px; left: 98px; cursor: move;}
		.rect{background-color: #fff; border: 2px solid #ccc; box-sizing: border-box; height: 9px; position: absolute; width: 9px;}
		.lt{left:-5px;top:-5px;cursor: se-resize;user-select:none}
		.rt{right:-5px;top:-5px;cursor: sw-resize;user-select:none}
		.lb{left:-5px;bottom:-5px;cursor: sw-resize;user-select:none}
		.rb{right:-5px;bottom:-5px;cursor: se-resize;user-select:none}
		.block-top{position: absolute;left:0;right:0;height:9px;top:-5px;cursor:  s-resize;user-select:none}
		.block-top .rect{position:absolute;left:50%;top:0;margin-left:-5px;user-select:none}
		.block-left{position:absolute;width: 9px;top:0;bottom:0;left:-5px;cursor: w-resize;user-select:none}
		.block-left .rect{position:absolute;top:50%;left:0;margin-top:-5px;user-select:none}
		.block-right{position:absolute;width: 9px;top:0;bottom:0;right:-5px;cursor: w-resize;user-select:none}
		.block-right .rect{position:absolute;top:50%;left:0;margin-top:-5px;user-select:none}
		.block-bottom{position:absolute;height: 9px;left:0;right:0;bottom:-5px;cursor:  s-resize;user-select:none}
		.block-bottom .rect{position:absolute;left:50%;top:0;margin-left:-5px;user-select:none}
	</style>
</head>
<body>
<input id="myfile" type="file">
<div id="mycut_bg" class="mycut-bg">
	<div class="mycut-main">
		<div class="mycut-left">
			<div id="upload_box" class="upload-box" unselectable="no"><img src="" id="initpic" class="initpic">
				<div id="dashed_box" class="dashed-box">
					<div class="block-top">
						<div class="rect"></div>
					</div>
					<div class="block-left">
						<div class="rect"></div>
					</div>
					<div class="block-right">
						<div class="rect"></div>
					</div>
					<div class="block-bottom">
						<div class="rect"></div>
					</div>
					<div class="rect lt"></div>
					<div class="rect rt"></div>
					<div class="rect lb"></div>
					<div class="rect rb"></div>
				</div>
			</div>
		</div>
		<div class="mycut-right">
			<canvas height="150" width="200" id="imgshow" class="imgshow"></canvas><br>
			<a onclick="cutResultHander()" class="mycut-confirm" href="javascript:;" target="_blank">确定</a>
		</div>
		<span class="mycut-close" onclick="$('#mycut_bg').hide()">×</span>
	</div>
</div>
<input type="file" name = "myname" id="mk">

	reset:function(opts,txt,$dom){//重置个参数,其中txt为二进制图片,$dom为file的同名隐藏域，接收url
		$.extend(myCut,opts);
		//然后运行起来。。。
		myCut.hiddenInput = $dom;
        $("#initpic").attr("src",txt);
        $('#mycut_bg').show();
        setTimeout(function(){
			showCutResult();
        },200);
	},//所有内部函数啦进来
	hiddenInput:null,
	WHrate:4/3,
	dragModem:null,
	uploadBoxH:$("#upload_box").height(),
	uploadBoxW:$("#upload_box").width(),
	mousepoint:null,//声明一个变量用于缓存鼠标位置，move事件会用新位置与这个缓存作比较从而计算出差距
	draging:function(ev){
		if(myCut.dragModem == null)return;
		//计算出x与y变化,计算完毕即可回填
		//myCut.mousepoint==null
		var obj = myCut.mouseCoords(ev);
		var cx = obj.x-myCut.mousepoint.x;
		var cy = obj.y-myCut.mousepoint.y;
		//回填
		myCut.mousepoint.x=obj.x;
		myCut.mousepoint.y=obj.y;
		switch(myCut.dragModem){
			case "lt":
				if(Math.abs(cy)>Math.abs(cx)){
					myCut.resizeTopY(cy);
				}else{
					myCut.resizeleftX(cx);
				}
				break;
			case "rt":
				if(Math.abs(cy)>Math.abs(cx)){
					myCut.resizeTopY(cy,true);
				}else{
					myCut.resizeRightX(cx,true);
				}
				break;
			case "lb":
				if(Math.abs(cy)>Math.abs(cx)){
					myCut.resizeBottomY(cy,true);
				}else{
					myCut.resizeleftX(cx,true);
				}
				break;
			case "rb":
				if(Math.abs(cy)>Math.abs(cx)){
					myCut.resizeBottomY(cy);
				}else{
					myCut.resizeRightX(cx);
				}
				break;
			case "block-top":
				myCut.resizeTopY(cy);
				break;
			case "block-left":
				myCut.resizeleftX(cx);
				break;
			case "block-right":
				myCut.resizeRightX(cx);
				break;
			case "block-bottom":
				myCut.resizeBottomY(cy);
				break;
			case "dashed_box":
				myCut.boxMove(cx,cy);
				break;
		}
		myCut.showCutResult();
	},
	resizeTopY:function(floatNum,desc){
		var dashedBox = $("#dashed_box");
		var boxH = dashedBox.height();
		var newBoxH = boxH-floatNum;
		var newPositionTop = dashedBox.position().top+floatNum;
		if(newBoxH>=0&&newPositionTop>=0){//尺寸调整,尺寸变为零将拒绝调整,position小于0将拒绝调整
			if(desc){
				var newBoxW = newBoxH*myCut.WHrate;
				if(dashedBox.position().left+newBoxW+2<=myCut.uploadBoxW){
					// 调整尺寸与位置
					dashedBox.css({"top":newPositionTop,"height":newBoxH,"width":newBoxW});
				}
			}else{
				var boxW = dashedBox.width();
				var newBoxW = newBoxH*myCut.WHrate;
				var newPositionLeft = dashedBox.position().left+boxW-newBoxW;
				if(newPositionLeft>=0){
					// 调整尺寸与位置
					dashedBox.css({"top":newPositionTop,"height":newBoxH,"left":newPositionLeft,"width":newBoxW});
				}
			}
		}
	},
	resizeBottomY:function(floatNum,desc){
		var dashedBox = $("#dashed_box");
		var boxH = dashedBox.height();
		var newBoxH = boxH+floatNum;
		if(desc){
			if(newBoxH>=0&&dashedBox.position().top+newBoxH+2<=myCut.uploadBoxH){
				var boxW = dashedBox.width();
				var newBoxW = newBoxH*myCut.WHrate;
				var newPositionLeft = dashedBox.position().left+boxW-newBoxW;
				if(newPositionLeft>=0){
					dashedBox.css({"height":newBoxH,"width":newBoxH*myCut.WHrate,"left":newPositionLeft});//尺寸调整
				}
			}
		}else{
			if(newBoxH>=0&&dashedBox.position().top+newBoxH+2<=myCut.uploadBoxH&&dashedBox.position().left+newBoxH*myCut.WHrate+2<=myCut.uploadBoxW){
				dashedBox.css({"height":newBoxH,"width":newBoxH*myCut.WHrate});//尺寸调整
			}
		}
	},
	resizeleftX:function(floatNum,desc){
		var dashedBox = $("#dashed_box");
		var boxW = dashedBox.width();
		var newBoxW = boxW-floatNum;
		var newPositionLeft = dashedBox.position().left+floatNum;
		if(newBoxW>=0&&newPositionLeft>=0){//尺寸调整,尺寸变为零将拒绝调整,position小于0将拒绝调整
			if(desc){
				var newBoxH = newBoxW/myCut.WHrate;
				if(dashedBox.position().top+newBoxH+2<=myCut.uploadBoxH){
					// 调整尺寸与位置
					dashedBox.css({"height":newBoxH,"left":newPositionLeft,"width":newBoxW});
				}
			}else{
				var boxH = dashedBox.height();
				var newBoxH = newBoxW/myCut.WHrate;
				var newPositionTop = dashedBox.position().top+boxH-newBoxH;
				if(newPositionTop>=0){
					// 调整尺寸与位置
					dashedBox.css({"top":newPositionTop,"height":newBoxH,"left":newPositionLeft,"width":newBoxW});
				}
			}
		}
	},
	resizeRightX:function(floatNum,desc){
		var dashedBox = $("#dashed_box");
		var boxW = dashedBox.width();
		var newBoxW = boxW+floatNum;
		if(desc){
			if(newBoxW>=0&&dashedBox.position().left+newBoxW+2<=myCut.uploadBoxW){
				var boxH = dashedBox.height();
				var newBoxH = newBoxW/myCut.WHrate;
				var newPositionTop = dashedBox.position().top+boxH-newBoxH;
				if(newPositionTop>=0){
					dashedBox.css({"width":newBoxW,"height":newBoxW/myCut.WHrate,"top":newPositionTop});//尺寸调整
				}
			}
		}else{
			if(newBoxW>=0&&dashedBox.position().left+newBoxW+2<=myCut.uploadBoxW&&dashedBox.position().top+newBoxW/myCut.WHrate+2<=myCut.uploadBoxH){
				dashedBox.css({"width":newBoxW,"height":newBoxW/myCut.WHrate});//尺寸调整
			}
		}
	},
	boxMove:function(cx,cy){
		var dashedBox = $("#dashed_box");
		var positionX = dashedBox.position().left+cx;
		var positionY = dashedBox.position().top+cy;
		if(positionX>=0&&positionX+dashedBox.width()+2<=myCut.uploadBoxW){
			dashedBox.css({"left":positionX});
		}
		if(positionY>=0&&positionY+dashedBox.height()+2<=myCut.uploadBoxH){
			dashedBox.css({"top":positionY});
		}
		//x轴移动,
		//左边0界限
		//y轴移动
	},
	//取鼠标相对文档坐标
	mouseCoords:function(ev) {
		if (ev.pageX || ev.pageY) {
			return {
				x : ev.pageX,
				y : ev.pageY
			};
		}
		return {//考虑到滚动条的情况
			x : ev.clientX + document.body.scrollLeft - document.body.clientLeft,
			y : ev.clientY + document.body.scrollTop - document.body.clientTop
		};
	},
    preventDefault:function(event) {
	    if (event.myCut.preventDefault) {
	        event.myCut.preventDefault();
	    } else {
	        event.returnValue = false;
	    }
	},
    stopPropagation:function(ev) {
	    if (ev.myCut.stopPropagation) {
	        ev.myCut.stopPropagation();
	    } else {
	        ev.cancelBubble = true;
	    }
    },
    showCutResult:function(){
    	var c =$("#imgshow").get(0);
		var cxt = c.getContext("2d");
		var img = new Image();
		img.src = $("#initpic").attr("src");
		var imgScaleRate = myCut.uploadBoxW/img.width;
		c.width=200;
		c.height=150;
		var sx = $("#dashed_box").position().left/imgScaleRate;//使用比例来计算得到
		var sy = $("#dashed_box").position().top/imgScaleRate;
		var swidth = $("#dashed_box").width()/imgScaleRate;
		var sheight = swidth/myCut.WHrate;
		cxt.drawImage(img,sx,sy,swidth,sheight,0,0,200,150);
    },
	initCountSourse:function(){
		//重置容器尺寸
		myCut.uploadBoxH = $("#upload_box").height();
		myCut.uploadBoxW = $("#upload_box").width();
		//虚线框位置和尺寸，预留
	},
	initpicLoadListener:function(){
		myCut.initCountSourse();
	}
}
myCut.init();
$.fn.cutPic = function(opts){
	// 1.重构
	var $hiddenInput  =$('<input type=\"hidden\" name=\"+'$(this).attr("name");'+\"/>').insertAfter($(this));
	$(this).change(function(){
			var file = $(this).get(0).files[0];
			if(file){
		        var reader = new FileReader();
		        reader.onload = function (event) {
					myCut.reset(opts,event.target.result,$hiddenInput);//重置cut对象
		        };
			    reader.readAsDataURL(file);
			}
	});
	// 这个dom将被插件重构为一个不带name的filter和一个隐藏域，并绑定change事件，事件是整个入口，将弹出遮罩层，接下
	//来的流程需要配置一个ajax的url，需要返回一个url，返回的url将被用于两个操作！一个流程完毕！
	// 应该扩展为自由尺寸和固定尺寸两种，固定比例的意义不大！目前只实现固定尺寸！这样初始化的时候需要传入长宽尺寸，
	// 至此初始化许要：长度，宽度，后台url，input的选择器，以及自定义输出函数！这样即可重用！
	//1.重构。绑定事件
	//2.生成style，
	//3.生成dom，如果dom已经存在，那么刷新各种事件
}

$("#mk").cutPic({
	resultWidth:200,//截取图像的宽度
	resultHeight:200,//截取图像的高度
	ajaxURL:'http://baidu.com',//后台接收2禁进制图片的程序的url
	callBackFN:function(url){//用来处理后台返回的url的函数
		console.log(url);
	}
});

//基于同一套dom的插件的运转
</script>
